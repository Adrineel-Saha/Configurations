spring:
  datasource:
    url: jdbc:mysql://localhost:3306/OrderServiceDatabase
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  jackson:
    mapper:
      sort-properties-alphabetically: false
    date-format: dd-MM-yyyy HH:mm:ss
    write-dates-as-timestamps: false
  kafka:
   consumer:
     bootstrap-servers: http://localhost:9092
     group-id: orderServiceGroup
     auto-offset-reset: earliest
     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
     value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
     properties:
       spring:
         json:
           trusted:
             packages: "*"
           type:
              mapping: "user:com.cognizant.orderservice.dtos.UserDTO,product:com.cognizant.orderservice.dtos.ProductDTO"

# Actuator endpoints for Circuit Breaker
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

# Circuit Breaker + Rate Limiter configuration
resilience4j:
  # Make the rate limiter aspect run OUTSIDE the circuit breaker (higher order = outer / runs first).
  # This way a rate-limit rejection surfaces as a 429 and is NOT swallowed/counted by the circuit breaker.
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      OrderMicroservice:
        registerHealthIndicator: true
        failureRateThreshold: 50
        minimumNumberOfCalls: 5
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        slidingWindowType: COUNT_BASED
  ratelimiter:
    rate-limiter-aspect-order: 1
    instances:
      OrderServiceRateLimiter:
        limit-for-period: 5      # permits per cycle
        limit-refresh-period: 2s   # cycle length
        timeout-duration: 0        # 0 = reject immediately, don't queue
