spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ProductServiceDatabase
    username: root
    password: root
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: always
  jackson:
    mapper:
      sort-properties-alphabetically: false
  kafka:
   producer:
     bootstrap-servers: http://localhost:9092
     key-serializer: org.apache.kafka.common.serialization.StringSerializer
     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
     properties:
      spring:
        json:
          type:
            mapping: "product:com.cognizant.productservice.dtos.ProductDTO"

# Rate Limiter configuration
resilience4j:
  ratelimiter:
    instances:
      ProductServiceRateLimiter:
        limit-for-period: 5      # permits per cycle
        limit-refresh-period: 2s   # cycle length
        timeout-duration: 0        # 0 = reject immediately, don't queue
